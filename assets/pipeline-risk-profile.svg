<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Illustrative pipeline risk profile</title><desc id="desc">Example expected annual loss along a 10 kilometre pipeline. Risk is failure probability multiplied by consequence. A peak near kilometre seven illustrates a region for closer review. Values are synthetic.</desc>
<rect width="1000" height="430" rx="12" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#17382c"><text x="85" y="38" font-size="21" font-weight="bold">Pipeline risk profile</text><text x="85" y="63" font-size="13" fill="#65776d">Risk = probability of failure × consequence</text><rect x="808" y="20" width="150" height="27" rx="5" fill="#edf3ee"/><text x="883" y="38" text-anchor="middle" font-size="11">ILLUSTRATIVE EXAMPLE</text></g>
<g stroke="#e4eae6"><path d="M100 305H940M100 255H940M100 205H940M100 155H940M100 105H940"/></g>
<path d="M100 305V90M100 305H940" stroke="#60766a" fill="none"/>
<g font-family="Arial,sans-serif" font-size="12" fill="#52665a" text-anchor="end"><text x="87" y="309">0</text><text x="87" y="259">2</text><text x="87" y="209">4</text><text x="87" y="159">6</text><text x="87" y="109">8</text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#52665a" text-anchor="middle"><text x="100" y="330">0</text><text x="268" y="330">2</text><text x="436" y="330">4</text><text x="604" y="330">6</text><text x="772" y="330">8</text><text x="940" y="330">10</text><text x="520" y="362" font-size="14">Distance along pipeline (km)</text><text transform="translate(30 200) rotate(-90)" font-size="13">Expected annual loss ($ thousands/year)</text></g>
<path d="M100 280L184 268L268 275L352 238L436 255L520 245L604 195L688 110L772 170L856 250L940 265V305H100Z" fill="#edf4ee"/>
<path d="M100 280L184 268L268 275L352 238L436 255L520 245L604 195L688 110L772 170L856 250L940 265" fill="none" stroke="#287049" stroke-width="4" stroke-linejoin="round"/>
<path d="M604 195L688 110L772 170" fill="none" stroke="#bc5a43" stroke-width="4"/>
<circle cx="688" cy="110" r="7" fill="#bc5a43" stroke="white" stroke-width="3"/>
<rect x="716" y="77" width="190" height="55" rx="6" fill="#fbefeb"/><g font-family="Arial,sans-serif" fill="#924533" font-size="12"><text x="730" y="99" font-weight="bold">Higher estimated risk</text><text x="730" y="118">Prioritise closer review</text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#52665a"><circle cx="110" cy="399" r="5" fill="#287049"/><text x="124" y="403">Example risk profile</text><circle cx="330" cy="399" r="5" fill="#bc5a43"/><text x="344" y="403">Region of higher example risk</text></g>
</svg>
